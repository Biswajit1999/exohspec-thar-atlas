[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exohspec-thar-atlas"
version = "0.1.0"
description = "Privacy-aware analysis and public data story for EXOhSPEC thorium-argon exposures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Biswajit Jana" }]
dependencies = [
  "astropy>=6.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
exohspec-thar = "exohspec_thar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

